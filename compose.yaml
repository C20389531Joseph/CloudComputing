version: '3.8'

services:
  app-normal:
    image: node:18-alpine
    command: sh -c "yarn install && yarn run dev-normal"
    ports:
      - "127.0.0.1:3000:3000"
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos

  app-readonly:
    image: node:18-alpine
    command: sh -c "yarn install && yarn run dev-readonly"
    ports:
      - "127.0.0.1:3001:3000"
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos

  mysql:
    image: mysql:8.0
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos

volumes:
  todo-mysql-data:
